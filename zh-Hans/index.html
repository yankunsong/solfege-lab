</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1><span class="brand">Solfège Lab</span> <span class="tagline" data-i18n="tagline">数字 → 唱名</span></h1>
      <label class="lang">
        <span class="sr-only" data-i18n="lang">语言</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <select id="langSelect"><option value="en">English</option><option value="zh-Hans" selected>简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ru">Русский</option></select>
      </label>
    </div>
    <p class="hint" data-i18n-html="hint">看数字，先自己读出唱名，再按 <kbd>空格</kbd> 核对。</p>
  </header>

  <main>
    <section class="stage" id="stage" aria-live="polite">
      <div class="stage-row">
        <button type="button" class="nav" id="prevBtn" aria-label="上一串">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="staff" id="staff"></div>
        <button type="button" class="nav" id="nextBtn" aria-label="下一串">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="prompt" id="prompt">按 <kbd>空格</kbd> 显示答案</p>
    </section>

    <section class="controls" id="controls" aria-label="练习设置">
      <div class="field">
        <span class="label" data-i18n="notes">练习哪些音</span>
        <div class="chips" id="chips"></div>
      </div>

      <div class="field">
        <span class="label" data-i18n="length">每串音的个数</span>
        <div class="range">
          <input type="number" id="minLen" min="1" max="8" value="2" aria-label="最短" />
          <span data-i18n="to">到</span>
          <input type="number" id="maxLen" min="1" max="8" value="3" aria-label="最长" />
        </div>
      </div>

      <div class="field">
        <span class="label" id="sevenLabel" data-i18n="seven">7 的唱名</span>
        <div class="segmented" role="radiogroup" aria-labelledby="sevenLabel" id="sevenGroup">
          <button type="button" role="radio" data-seven="si">si</button>
          <button type="button" role="radio" data-seven="ti">ti</button>
        </div>
      </div>

      <div class="field toggles">
        <label><input type="checkbox" id="allowRepeat" /> <span data-i18n="repeat">允许相邻重复（如 33）</span></label>
        <label><input type="checkbox" id="playSound" checked /> <span data-i18n="sound">显示答案时播放音高（1 = C）</span></label>
      </div>

      <p class="stats" id="stats">已练 0 串</p>
    </section>

    <section class="about">
      <h2 data-i18n="aboutTitle">什么是简谱？</h2>
      <p id="aboutBody">简谱是用数字记写音乐的记谱法，在中国及东亚广泛使用。数字 1–7 代表音阶的七个音级，唱作 <b>do re mi fa sol la si</b>。在 C 大调中，1 = C，2 = D，3 = E，以此类推。看到数字能直接唱出唱名，是简谱视唱的第一步。</p>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n-html="footKeys"><kbd>空格</kbd> 显示 / 隐藏答案 · <kbd>←</kbd> <kbd>→</kbd> 上一串 / 下一串</span>
    <span data-i18n="footTap">手机上点数字显示答案，点箭头切换</span>
  </footer>

  <script src="../i18n.js?v=10"></script>
  <script src="../app.js?v=10"></script>
</body>
</html>
