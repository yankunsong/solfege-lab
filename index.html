<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简谱练耳 · 唱名速认</title>
  <meta name="description" content="看简谱数字，读出唱名，按空格核对答案。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>简谱 <span>唱名速认</span></h1>
    <p class="hint">看数字，先自己读出唱名，再按 <kbd>空格</kbd> 核对。</p>
  </header>

  <main>
    <section class="stage" id="stage" aria-live="polite">
      <div class="staff" id="staff"></div>
      <p class="prompt" id="prompt">按 <kbd>空格</kbd> 显示答案</p>
    </section>

    <section class="controls" aria-label="练习设置">
      <div class="field">
        <span class="label">练习哪些音</span>
        <div class="chips" id="chips"></div>
      </div>

      <div class="field">
        <span class="label">每串长度</span>
        <div class="range">
          <input type="number" id="minLen" min="1" max="8" value="2" aria-label="最短长度" />
          <span>到</span>
          <input type="number" id="maxLen" min="1" max="8" value="3" aria-label="最长长度" />
          <span>个音</span>
        </div>
      </div>

      <div class="field toggles">
        <label><input type="checkbox" id="allowRepeat" /> 允许相邻重复（如 33）</label>
        <label><input type="checkbox" id="playSound" checked /> 显示答案时播放音高（1 = C）</label>
      </div>

      <p class="stats" id="stats">已练 0 串</p>
    </section>
  </main>

  <footer class="foot">
    <span><kbd>空格</kbd> 显示答案 / 下一串</span>
    <span>手机上点数字区域即可</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
